name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  booking-service:
    name: Booking service (Kotlin / Spring Boot) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-service   # change if your folder name differs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run tests
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew && ./gradlew test --no-daemon
          elif [ -f pom.xml ]; then
            mvn -B test
          else
            echo "No Gradle or Maven build found in booking-service" && exit 1
          fi

  tracking-service:
    name: Tracking service (Node / Express) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking-service  # change if your folder name differs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tracking-service/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [booking-service, tracking-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
